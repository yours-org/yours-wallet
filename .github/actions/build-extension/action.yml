name: Build extension
description: Install the pinned toolchain, then check, build, verify, and package the extension into release/

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: .bun-version

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Install the locked Puppeteer browser for UI tests
      shell: bash
      run: node node_modules/puppeteer/lib/puppeteer/node/cli.js browsers install chrome

    # Exact executable exception from Chromium's AppArmor guidance. The test
    # requires PID and Seccomp isolation; the host-wide restriction stays on.
    - name: Allow the exact test browser to create its Linux sandbox
      if: runner.os == 'Linux'
      shell: bash
      run: |
        browser_path="$(node --input-type=module -e "import puppeteer from 'puppeteer'; console.log(await puppeteer.executablePath())")"
        [[ "$browser_path" =~ ^/[a-zA-Z0-9._/-]+/chrome$ ]]
        test -x "$browser_path"
        stat -c '%n %U %a' "$browser_path"
        sha256sum "$browser_path"
        if [[ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
          restriction="$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)"
          echo "AppArmor user namespace restriction: $restriction"
          if [[ "$restriction" == 1 ]]; then
            [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
            profile_name="yours-wallet-ui-tests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            profile_path="/etc/apparmor.d/$profile_name"
            marker="$RUNNER_TEMP/$profile_name.created"
            test ! -e "$profile_path"
            test ! -e "$marker"
            profile_file="$(mktemp)"
            printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile %s "%s" flags=(unconfined) {\n  userns,\n}\n' "$profile_name" "$browser_path" > "$profile_file"
            touch "$marker"
            sudo install -o root -g root -m 0644 "$profile_file" "$profile_path"
            rm "$profile_file"
            sudo apparmor_parser -r "$profile_path"
            cat "$profile_path"
          fi
        fi

    - name: Check formatting
      shell: bash
      run: bun run format:check

    - name: Typecheck
      shell: bash
      run: bun run typecheck

    - name: Test public wallet behavior
      shell: bash
      run: bun run test

    - name: Remove the temporary test browser AppArmor exception
      if: always() && runner.os == 'Linux'
      shell: bash
      run: |
        [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
        profile_name="yours-wallet-ui-tests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        profile_path="/etc/apparmor.d/$profile_name"
        marker="$RUNNER_TEMP/$profile_name.created"
        if [[ -f "$marker" ]]; then
          if [[ -f "$profile_path" ]]; then
            sudo apparmor_parser -R "$profile_path"
            sudo rm "$profile_path"
          fi
          rm "$marker"
        fi

    - name: Build
      shell: bash
      run: bun run build

    - name: Verify build output
      shell: bash
      run: bun run verify:build

    - name: Package
      shell: bash
      run: bun run package
